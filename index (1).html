<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E0475B">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Table Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one phone on the table between two people — a cover, then a single card deck with the draw button in thumb reach. */
:root {
  --bg: #E9ECF5;
  --paper: #FFFFFF;
  --ink: #1D2042;
  --muted: #5F6488;
  --line: #CDD2E4;
  --accent: #E0475B;
  --accent-ink: #FFFFFF;
  --blush: #FFD3DC;
  --shadow: 0 1px 0 rgba(29,32,66,.06), 0 18px 40px -18px rgba(29,32,66,.35);
  --c-warm: #F2A541; --c-know: #4C8BF5; --c-wyr: #8E5CF0; --c-story: #19A97B; --c-dream: #E46FB0; --c-deep: #3D4A8F; --c-us: #E0475B; --c-scen: #0E9AA7; --c-dare: #F06A2A; --c-faith: #B8860B;
  --display: "Bricolage Grotesque", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --body: "Figtree", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12132A; --paper: #1E2044; --ink: #EDEBF7; --muted: #A3A7C9; --line: #34386A;
  --accent: #FF6B7D; --accent-ink: #1A0B10; --blush: #3E2048;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 18px 40px -18px rgba(0,0,0,.8);
  --c-deep: #8C99E8; --c-faith: #E0B54A; --c-scen: #2EC4CF; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12132A; --paper: #1E2044; --ink: #EDEBF7; --muted: #A3A7C9; --line: #34386A;
  --accent: #FF6B7D; --accent-ink: #1A0B10; --blush: #3E2048;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 18px 40px -18px rgba(0,0,0,.8);
  --c-deep: #8C99E8; --c-faith: #E0B54A; --c-scen: #2EC4CF; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; padding-inline: 16px; padding-block: 0; word-break: keep-all; overflow-wrap: break-word; }
.app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 18px; padding-block: 20px 28px; }

/* language toggle */
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; background: var(--paper); }
.lang button { font: 600 .8rem/1 var(--body); border: 0; background: transparent; color: var(--muted); padding: 7px 11px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* cover */
.cover { flex: 1; display: flex; flex-direction: column; gap: 28px; justify-content: center; }
.cover-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cover-date { font: 600 .78rem/1.3 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
/* cover: blush glow, floating hearts, a fan of heart playing cards */
.cover-wrap { position: relative; }
.cover { position: relative; z-index: 1; }
.floaters { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; background: radial-gradient(90% 55% at 50% 38%, var(--blush), transparent 75%); }
.floaters svg, .burst { position: absolute; fill: var(--c); }
.floaters .critter { position: absolute; bottom: -40px; animation: floatUp var(--d) linear var(--delay) infinite; opacity: 0; }
.floaters svg { bottom: -40px; animation: floatUp var(--d) linear var(--delay) infinite; opacity: 0; }
@keyframes floatUp {
  0% { transform: translate(0, 0) rotate(var(--r)) scale(.6); opacity: 0; }
  12% { opacity: var(--o); }
  50% { transform: translate(var(--x), -55vh) rotate(calc(var(--r) * -1)) scale(1); }
  88% { opacity: var(--o); }
  100% { transform: translate(0, -110vh) rotate(var(--r)) scale(.8); opacity: 0; }
}
.burst { width: 22px; height: 22px; pointer-events: none; z-index: 5; animation: pop .9s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes pop { 0% { transform: translate(-50%,-50%) scale(.3); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--r)); opacity: 0; } }

.fan-zone { position: relative; max-width: 360px; width: 100%; margin-inline: auto; }
.fan { position: relative; display: block; height: 215px; margin-inline: auto; width: 100%; max-width: 300px; background: none; border: 0; padding: 0; cursor: pointer; animation: bob 3.2s ease-in-out infinite; }
.fan > span { position: absolute; left: 50%; bottom: 0; width: 132px; height: 184px; margin-left: -66px; background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); border: 2px solid color-mix(in srgb, var(--c) 35%, transparent); transform-origin: 50% 120%; transition: transform .5s cubic-bezier(.2,.8,.2,1); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px; fill: var(--c); color: var(--c);
  background-image: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--c) 12%, transparent), transparent 65%); }
.fan > span:nth-child(1) { --c: var(--c-dream); transform: rotate(-24deg); }
.fan > span:nth-child(2) { --c: var(--c-wyr); transform: rotate(-9deg); }
.fan > span:nth-child(3) { --c: var(--c-warm); transform: rotate(7deg); }
.fan > span:nth-child(4) { --c: var(--c-us); transform: rotate(21deg); }
.fan:hover > span:nth-child(1), .fan:focus-visible > span:nth-child(1) { transform: rotate(-30deg); }
.fan:hover > span:nth-child(2) { transform: rotate(-12deg); }
.fan:hover > span:nth-child(4), .fan:focus-visible > span:nth-child(4) { transform: rotate(27deg) translateY(-6px); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.pip { position: absolute; display: flex; flex-direction: column; align-items: center; font: 700 .9rem/1 var(--display); gap: 1px; }
.pip svg { width: 13px; height: 13px; }
.pip.tl { top: 9px; left: 10px; }
.pip.br { bottom: 9px; right: 10px; transform: rotate(180deg); }
.mid { width: 52px; height: 52px; }
.mid.big { width: 64px; height: 64px; }
.duo, .trio { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.duo svg { width: 34px; height: 34px; }
.duo svg:last-child { transform: rotate(180deg); }
.trio svg { width: 28px; height: 28px; }
.trio svg:nth-child(2) { transform: rotate(-12deg) scale(1.15); }
.beat { animation: beat 1.4s ease-in-out infinite; transform-origin: 50% 60%; }
@keyframes beat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(.96); } 45% { transform: scale(1.1); } }

.names { font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 15vw, 4.6rem); line-height: .95; letter-spacing: -.02em; text-align: center; display: flex; align-items: center; justify-content: center; gap: .1em; }
.names .amp { width: .62em; height: .62em; fill: var(--accent); flex: none; }
.start { display: flex; align-items: center; justify-content: center; gap: 8px; }
.start svg { width: 18px; height: 18px; fill: currentColor; }
@media (prefers-reduced-motion: reduce) { .fan, .beat, .floaters svg, .floaters .critter { animation: none; } .floaters svg, .floaters .critter { display: none; } }
.title-sub { font-family: var(--display); font-size: clamp(1.25rem, 5vw, 1.6rem); text-align: center; margin-top: 10px; }
.title-sub small { display: block; font-family: var(--body); font-size: .95rem; color: var(--muted); margin-top: 8px; }
.cover .btn.primary { padding: 18px; font-size: 1.25rem; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0; }
.logo .amp { color: var(--accent); }
.head-right { display: flex; align-items: center; gap: 10px; }
.count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 .8rem/1 var(--body); border: 1.5px solid var(--line); background: transparent; color: var(--muted); padding: 8px 11px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s, border-color .15s; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); opacity: .45; }
.chip[aria-pressed="true"] { border-color: var(--c); color: var(--ink); background: color-mix(in srgb, var(--c) 14%, transparent); }
.chip[aria-pressed="true"] i { opacity: 1; }
.chip:focus-visible, button:focus-visible, input:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 360px; perspective: 1200px; }
.card { position: relative; background: var(--paper); border-radius: 22px; box-shadow: var(--shadow); padding: 26px 24px 22px; min-height: 340px; display: flex; flex-direction: column; gap: 18px; border-top: 8px solid var(--c, var(--accent)); transform-origin: 50% 100%; }
.card.flip { animation: deal .45s cubic-bezier(.2,.8,.2,1); }
@keyframes deal { 0% { transform: translateY(18px) rotateX(-14deg) scale(.97); opacity: .3; } 100% { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card.flip { animation: none; } .fan span { transition: none; } }

.meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cat { font: 700 .72rem/1 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--c); }
.turn { font-size: .85rem; color: var(--muted); }
.turn b { color: var(--ink); font-weight: 600; }
.q { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 6.5vw, 2.2rem); line-height: 1.18; letter-spacing: -.015em; text-wrap: balance; flex: 1; display: flex; align-items: center; min-width: 0; }
html[lang="ko"] .q { font-weight: 400; letter-spacing: 0; line-height: 1.3; }
.nudge { font-size: .9rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 14px; }
.nudge b { color: var(--ink); font-weight: 600; }

.controls { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: stretch; }
.btn { font: 600 1rem/1 var(--body); border-radius: 16px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); padding: 16px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-family: var(--display); font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: default; }

.players { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.players label { display: flex; align-items: center; gap: 6px; flex: 1 1 140px; min-width: 0; white-space: nowrap; }
.players input { font: 500 .95rem var(--body); color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; min-width: 0; }
.foot { font-size: .8rem; color: var(--muted); text-align: center; line-height: 1.5; }
.foot kbd { font-family: var(--body); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="h" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
</svg>

<div class="app cover-wrap" id="coverView">
  <div class="floaters" id="floaters" aria-hidden="true"></div>
  <div class="cover">
    <div class="cover-top">
      <span class="cover-date" id="coverDate"></span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ko">한국어</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <div class="fan-zone">
    <button class="fan" id="fan" type="button" aria-label="Hearts">
      <span><b class="pip tl">A<svg><use href="#h"/></svg></b><svg class="mid"><use href="#h"/></svg><b class="pip br">A<svg><use href="#h"/></svg></b></span>
      <span><b class="pip tl">2<svg><use href="#h"/></svg></b><span class="duo"><svg><use href="#h"/></svg><svg><use href="#h"/></svg></span><b class="pip br">2<svg><use href="#h"/></svg></b></span>
      <span><b class="pip tl">3<svg><use href="#h"/></svg></b><span class="trio"><svg><use href="#h"/></svg><svg><use href="#h"/></svg><svg><use href="#h"/></svg></span><b class="pip br">3<svg><use href="#h"/></svg></b></span>
      <span><b class="pip tl">♡</b><svg class="mid big beat"><use href="#h"/></svg><b class="pip br">♡</b></span>
    </button>
    </div>
    <div>
      <div class="names">재익<svg class="amp beat"><use href="#h"/></svg>소은</div>
      <div class="title-sub" id="coverTitle"></div>
    </div>
    <button class="btn primary start" id="start"></button>
  </div>
</div>

<div class="app" id="gameView" hidden>
  <header>
    <button class="logo" id="home" aria-label="Back to cover">재익 <span class="amp">&amp;</span> 소은</button>
    <div class="head-right">
      <span class="count" id="count"></span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ko">한</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div class="chips" id="chips" role="group" aria-label="Topics"></div>

  <div class="stage">
    <article class="card" id="card" aria-live="polite">
      <div class="meta">
        <span class="cat" id="cat"></span>
        <span class="turn" id="turn"></span>
      </div>
      <div class="q" id="q"></div>
      <div class="nudge" id="nudge"></div>
    </article>
  </div>

  <div class="controls">
    <button class="btn" id="back" aria-label="Previous question">←</button>
    <button class="btn primary" id="draw"></button>
    <button class="btn" id="skip"></button>
  </div>

  <div class="players">
    <label for="p1"><span id="l1"></span> <input id="p1" maxlength="20"></label>
    <label for="p2"><span id="l2"></span> <input id="p2" maxlength="20"></label>
  </div>
  <p class="foot" id="foot"></p>
</div>

<script>
const CATS = {
  warm: { en: "Warm-up", ko: "설렘 워밍업", color: "var(--c-warm)", qs: [
    ["What's your idea of a cozy date?", "아늑한 데이트라고 하면 어떤 게 떠올라요?"],
    ["Café date or walk date?", "카페 데이트가 좋아요, 산책 데이트가 좋아요?"],
    ["Is there a date spot in this city you've always wanted to try?", "이 도시에서 꼭 가보고 싶었던 데이트 장소 있어요?"],
    ["Do you like planning dates, or being surprised?", "데이트 계획 짜는 게 좋아요, 깜짝 계획 받는 게 좋아요?"],
    ["What's your favorite thing to eat on a date?", "데이트할 때 먹기 좋아하는 음식은요?"],
    ["What song would you play on a drive together?", "같이 드라이브하면 틀고 싶은 노래는요?"],
    ["What's the cutest couple moment you've ever seen?", "지금까지 본 커플 중에 제일 귀여웠던 모습은요?"],
    ["Matching couple items: yes or no?", "커플템, 찬성이에요 반대예요?"],
    ["Is there a café you'd want to take someone you like?", "좋아하는 사람 데려가고 싶은 카페 있어요?"],
    ["How would you spend an evening with someone you like?", "좋아하는 사람이랑 저녁 시간을 보낸다면 뭐 하고 싶어요?"],
    ["Date day: rain or snow?", "데이트하는 날, 비 오는 날 vs 눈 오는 날?"],
    ["What dessert would you want to share?", "같이 나눠 먹고 싶은 디저트는요?"],
    ["Which season feels the most romantic to you?", "제일 로맨틱하게 느껴지는 계절은요?"],
    ["What small moment on a date makes you smile?", "데이트할 때 나를 웃게 만드는 작은 순간은요?"],
    ["Picnic, exhibition, or night market?", "피크닉, 전시회, 야시장 중에 고르면?"],
    ["Do you like long phone calls at night?", "밤에 길게 통화하는 거 좋아해요?"],
    ["How would you spend a lazy Saturday with someone?", "누군가와 느긋한 토요일을 보낸다면 뭐 하고 싶어요?"],
    ["Photo booth: love it? Who picks the poses?", "인생네컷 좋아해요? 포즈는 누가 정해요?"],
    ["What's a sweet text you'd love to get?", "받으면 설렐 것 같은 문자는요?"],
    ["What's the best part of an autumn date?", "가을 데이트의 제일 좋은 점은요?"]
  ]},
  know: { en: "Getting to know you", ko: "알아가기", color: "var(--c-know)", qs: [
    ["What were you like when you had a crush in school?", "학교 다닐 때 짝사랑하면 어떤 스타일이었어요?"],
    ["When do you feel most understood by someone?", "언제 '이 사람이 날 알아주는구나' 느껴요?"],
    ["What do your friends think you'd be like in a relationship?", "친구들은 내가 연애하면 어떤 사람일 거라고 해요?"],
    ["What do you do without realizing when you really like someone?", "누군가를 정말 좋아하면 나도 모르게 하는 행동이 있어요?"],
    ["When you miss someone, do you text or call?", "보고 싶을 때 문자파예요, 전화파예요?"],
    ["How do you show love: words, time, gifts, helping, or hugs?", "마음을 표현할 때 말, 함께하는 시간, 선물, 도움, 스킨십 중 어떤 편이에요?"],
    ["And how do you most like to receive love?", "반대로 어떤 방식으로 사랑받을 때 제일 좋아요?"],
    ["What's a quirk of yours someone only learns by dating you?", "연애해봐야 알 수 있는 나만의 특이한 점은요?"],
    ["What's your family like? Who are you closest to?", "가족은 어떤 분위기예요? 누구랑 제일 친해요?"],
    ["How do you act when you're shy?", "부끄러울 때 어떻게 행동해요?"],
    ["What do you need when you're tired or upset?", "지치거나 속상할 때 필요한 게 뭐예요?"],
    ["What are you like once you're comfortable with someone?", "편해진 사람 앞에서는 어떤 모습이에요?"],
    ["How would your parents describe you?", "부모님은 나를 어떤 사람이라고 하실까요?"],
    ["What small thing can ruin your mood?", "기분을 확 망치는 작은 일은요?"],
    ["What small thing can make your whole day?", "하루를 통째로 좋게 만드는 작은 일은요?"],
    ["How do you handle it when you disagree with someone close?", "가까운 사람이랑 의견이 다를 때 어떻게 하는 편이에요?"],
    ["Planner or go-with-the-flow?", "계획파예요, 즉흥파예요?"],
    ["What does a perfect day off look like for you?", "완벽한 쉬는 날은 어떤 모습이에요?"],
    ["What are you proud of that you don't talk about much?", "잘 말은 안 하지만 스스로 뿌듯한 게 있어요?"],
    ["What instantly makes you feel calm?", "바로 마음이 편해지는 게 뭐예요?"],
    ["What's something you're a little nerdy about?", "살짝 덕후처럼 빠져 있는 게 있어요?"],
    ["What's something you're really good at that people wouldn't guess?", "사람들은 잘 모르는데 사실 엄청 잘하는 게 있어요?"],

const NUDGES = [
  ["Ask <b>“why?”</b> after the answer. That's where the good stuff is.", "대답 듣고 <b>“왜요?”</b> 하고 물어봐요. 좋은 얘기는 거기서 나와요."],
  ["Now flip it: the other person answers too.", "이제 바꿔서, 상대방도 대답해요."],
  ["Pick one thing from their answer and ask more about it.", "상대 대답에서 하나 골라서 더 물어봐요."],
  ["No wrong answers. Short is fine, stories are better.", "정답은 없어요. 짧아도 괜찮고, 이야기가 붙으면 더 좋아요."],
  ["If it sparks a tangent, follow it. The card can wait.", "얘기가 딴 데로 새도 괜찮아요. 카드는 기다려줘요."],
  ["Share a time you felt the same way.", "나도 비슷하게 느꼈던 때를 얘기해봐요."],
  ["Try asking <b>“what was that like?”</b>", "<b>“그때 어땠어요?”</b> 하고 물어봐요."],
  ["Guess their answer before they say it.", "대답 듣기 전에 상대 답을 먼저 맞혀봐요."]
];

const DARE_NUDGES = [
  ["Do it now. The other person decides if it counts.", "지금 바로! 성공인지는 상대가 판정해요."],
  ["Too much? Use Skip. No pressure.", "부담되면 넘기기 눌러도 돼요."],
  ["Bonus: the other person does it too.", "보너스: 상대도 똑같이 해보기."],
  ["Take a photo of the moment if you want to remember it.", "기억하고 싶으면 그 순간 사진으로 남겨요."]
];

const CAT_ORDER = ["deep", "us", "scen", "dare", "dream", "story", "wyr", "faith", "warm", "know"];

const UI = {
  en: {
    coverDate: "Fri · Oct 9, 2026",
    coverTitle: "Date night, Oct 9<small>One card at a time. No awkward silences allowed.</small>",
    start: "Let's start", draw: "Next question", skip: "Skip",
    l1: "First up", l2: "Then", p1: "재익", p2: "소은",
    left: (a, b) => `${a} of ${b} left`,
    first: n => `<b>${n}</b> goes first`,
    dare: n => `<b>${n}</b>'s dare`,
    foot: "Turns swap with every new question. You both answer; the named person just goes first. <kbd>Space</kbd> for next."
  },
  ko: {
    coverDate: "2026. 10. 9 (금) · 한글날",
    coverTitle: "10월 9일 데이트<small>어색할 틈 없이, 카드 한 장씩 천천히</small>",
    start: "시작하기", draw: "다음 질문", skip: "넘기기",
    l1: "먼저", l2: "다음", p1: "재익", p2: "소은",
    left: (a, b) => `${b}개 중 ${a}개 남음`,
    first: n => `<b>${n}</b> 먼저`,
    dare: n => `<b>${n}</b>의 미션`,
    foot: "질문마다 순서가 바뀌어요. 둘 다 대답하고, 이름 나온 사람이 먼저! <kbd>Space</kbd> 키로 다음 질문."
  }
};

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let lang = store.get("tt2-lang", "ko");
let active = new Set(store.get("tt3-active", CAT_ORDER.filter(k => k !== "warm" && k !== "know")));
let seen = new Set(store.get("tt4-seen", []));
let history = [];
let pos = -1;
let turn = 0;

const all = Object.entries(CATS).flatMap(([k, c]) => c.qs.map((q, i) => ({ k, i, id: k + i })));
const L = () => lang === "ko" ? 1 : 0;
const escapeHtml = s => s.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function applyLang() {
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  $("coverDate").textContent = t.coverDate;
  $("coverTitle").innerHTML = t.coverTitle;
  $("start").innerHTML = `${t.start}<svg aria-hidden="true"><use href="#h"/></svg>`;
  $("draw").textContent = t.draw;
  $("skip").textContent = t.skip;
  $("l1").textContent = t.l1;
  $("l2").textContent = t.l2;
  $("p1").placeholder = t.p1; $("p2").placeholder = t.p2;
  $("foot").innerHTML = t.foot;
  renderChips(); updateCount();
  if (pos >= 0) show(history[pos], false);
}

function renderChips() {
  const box = $("chips"); box.innerHTML = "";
  for (const k of CAT_ORDER) {
    const c = CATS[k];
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.style.setProperty("--c", c.color);
    b.setAttribute("aria-pressed", active.has(k));
    b.innerHTML = `<i></i>${c[lang]}`;
    b.onclick = () => {
      if (active.has(k) && active.size === 1) return;
      active.has(k) ? active.delete(k) : active.add(k);
      store.set("tt3-active", [...active]);
      renderChips(); updateCount();
    };
    box.appendChild(b);
  }
}

function pool() { return all.filter(x => active.has(x.k)); }
function updateCount() {
  const p = pool(); const left = p.filter(x => !seen.has(x.id)).length;
  $("count").textContent = UI[lang].left(left, p.length);
}
function names() { return [$("p1").value.trim() || "재익", $("p2").value.trim() || "소은"]; }

function show(item, animate = true) {
  const c = CATS[item.k];
  const card = $("card");
  card.style.setProperty("--c", c.color);
  $("cat").textContent = c[lang];
  $("q").textContent = c.qs[item.i][L()];
  $("turn").innerHTML = UI[lang][c.dare ? "dare" : "first"](escapeHtml(names()[item.t]));
  const nl = c.dare ? DARE_NUDGES : NUDGES;
  $("nudge").innerHTML = nl[item.n % nl.length][L()];
  if (animate) { card.classList.remove("flip"); void card.offsetWidth; card.classList.add("flip"); }
  $("back").disabled = pos <= 0;
}

function draw(switchTurn = true) {
  if (pos < history.length - 1) { pos++; show(history[pos]); return; }
  let p = pool().filter(x => !seen.has(x.id));
  if (!p.length) { pool().forEach(x => seen.delete(x.id)); p = pool(); }
  const pick = p[Math.floor(Math.random() * p.length)];
  seen.add(pick.id); store.set("tt4-seen", [...seen]);
  if (history.length && switchTurn) turn = 1 - turn;
  const item = { k: pick.k, i: pick.i, t: turn, n: Math.floor(Math.random() * NUDGES.length) };
  history.push(item); pos = history.length - 1;
  show(item); updateCount();
}

function go(view) {
  $("coverView").hidden = view !== "cover";
  $("gameView").hidden = view !== "game";
  if (view === "game" && pos < 0) draw(true);
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("tt2-lang", lang); applyLang(); });
$("start").onclick = () => go("game");
$("home").onclick = () => go("cover");
$("draw").onclick = () => draw(true);
$("skip").onclick = () => { if (pos < history.length - 1) history.length = pos + 1; draw(false); };
$("back").onclick = () => { if (pos > 0) { pos--; show(history[pos]); } };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || $("gameView").hidden) return;
  if (e.code === "Space" || e.key === "ArrowRight") { e.preventDefault(); draw(true); }
  if (e.key === "ArrowLeft") $("back").click();
});
for (const id of ["p1", "p2"]) {
  $(id).value = store.get("tt2-" + id, id === "p1" ? "재익" : "소은");
  $(id).addEventListener("input", () => { store.set("tt2-" + id, $(id).value); if (pos >= 0) show(history[pos], false); });
}

const HEART_COLORS = ["var(--c-us)", "var(--c-dream)", "var(--accent)", "var(--c-wyr)", "var(--c-warm)"];
const svgHeart = () => { const el = document.createElementNS("http://www.w3.org/2000/svg", "svg"); el.innerHTML = '<use href="#h"/>'; return el; };
(function floaters() {
  const box = $("floaters");
  ["🐢", "🐰", "🥩", "🐰", "🐢", "🥩"].forEach((em, i) => {
    const el = document.createElement("span");
    el.textContent = em; el.className = "critter";
    el.style.cssText = `left:${8 + i * 15 + Math.random() * 6}%;font-size:${18 + Math.random() * 10}px;--d:${9 + Math.random() * 6}s;--delay:${-Math.random() * 14}s;--x:${(Math.random() * 50 - 25).toFixed(0)}px;--r:${(Math.random() * 30 - 15).toFixed(0)}deg;--o:.85`;
    box.appendChild(el);
  });
  for (let i = 0; i < 16; i++) {
    const el = svgHeart(), size = 12 + Math.random() * 22;
    el.style.cssText = `left:${Math.random() * 95}%;width:${size}px;height:${size}px;--c:${HEART_COLORS[i % HEART_COLORS.length]};--d:${7 + Math.random() * 7}s;--delay:${-Math.random() * 14}s;--x:${(Math.random() * 60 - 30).toFixed(0)}px;--r:${(Math.random() * 40 - 20).toFixed(0)}deg;--o:${(.35 + Math.random() * .45).toFixed(2)}`;
    box.appendChild(el);
  }
})();
$("fan").onclick = e => {
  const wrap = $("coverView"), r = wrap.getBoundingClientRect();
  const x = (e.clientX || r.left + r.width / 2) - r.left, y = (e.clientY || r.top + 200) - r.top;
  for (let i = 0; i < 12; i++) {
    const el = svgHeart(), a = (i / 12) * Math.PI * 2, d = 60 + Math.random() * 70;
    el.classList.add("burst");
    el.style.cssText = `left:${x}px;top:${y}px;--c:${HEART_COLORS[i % HEART_COLORS.length]};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px;--r:${Math.random() * 60 - 30}deg`;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 950);
  }
};

applyLang();
</script>
